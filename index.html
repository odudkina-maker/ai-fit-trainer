<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fit Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏋️‍♀️ AI Fit Trainer</h1>
            <p>Твій персональний онлайн-тренер</p>
        </header>

        <main>
            <!-- Налаштування API Ключа -->
            <section class="api-section">
                <h2>🔑 Gemini API Key</h2>
                <input type="password" id="apiKeyInput" placeholder="Вставити Ваш API Key">
            </section>

            <!-- Секція завантаження скріншота -->
            <section class="upload-section">
                <h2>1. Завантаж скріншот вправи</h2>
                <div class="drop-zone" id="dropZone">
                    <p>Натисни або перетягни сюди фото вправи</p>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                <div id="previewContainer" class="hidden">
                    <img id="imagePreview" src="" alt="Прев'ю вправи">
                </div>
            </section>

            <!-- Налаштування тренера -->
            <section class="settings-section">
                <h2>2. Налаштування тренера</h2>
                <div class="form-group">
                    <label for="voiceSelect">Голос тренера:</label>
                    <select id="voiceSelect">
                        <option value="female">Жіночий (Енергійний)</option>
                        <option value="male">Чоловічий (Строгий)</option>
                    </select>
                </div>
                <button id="analyzeBtn" class="btn-primary" disabled>Аналізувати вправу (AI)</button>
            </section>

            <!-- Екран тренування -->
            <section id="workoutScreen" class="workout-section hidden">
                <h2 id="exerciseTitle">Аналізуємо...</h2>
                <div class="timer-display" id="timer">00:00</div>
                <div class="status-box" id="aiFeedback">Аналіз зображення...</div>
                <div class="controls" style="margin-top: 15px;">
                    <button id="pauseBtn" class="btn-secondary">Пауза</button>
                    <button id="stopBtn" class="btn-danger" style="margin-top: 8px;">Завершити</button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
